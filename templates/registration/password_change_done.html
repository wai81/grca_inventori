{% extends "layouts/base.html" %}
{% block title %}Пароль изменён{% endblock %}

{% block content %}
    <div class="pc-container">
        <div class="pc-content">

            <div class="page-header">
                <div class="page-block">
                    <div class="page-header-title"><h5 class="m-b-10">Пароль изменён</h5></div>
                    <ul class="breadcrumb">
                        <li class="breadcrumb-item"><a href="{% url 'index' %}">Главная</a></li>
                        <li class="breadcrumb-item"><a href="{% url 'profile' %}">Мой профиль</a></li>
                        <li class="breadcrumb-item" aria-current="page">Смена пароля</li>
                    </ul>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-6 col-xl-5">
                    <div class="card">
                        <div class="card-body d-flex align-items-center gap-3">
                            <span class="profile-icon profile-icon--ok"><i class="ti ti-check"></i></span>
                            <div>
                                <div class="fw-semibold">Пароль успешно изменён</div>
                                <div class="text-muted small">При следующем входе используйте новый пароль.</div>
                            </div>
                        </div>
                        <div class="card-footer">
                            <a class="btn btn-primary" href="{% url 'profile' %}">В профиль</a>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
{% endblock content %}
