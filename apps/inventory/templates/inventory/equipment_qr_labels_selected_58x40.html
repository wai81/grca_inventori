<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Этикетки 58x40</title>
    {% include "inventory/includes/label_58x40_styles.html" %}
</head>
<body>
<div class="toolbar">
    <a class="btn" href="{{ equipment_list_url }}">Назад</a>
    <span>Этикеток: {{ objects|length }} · 58×40 мм</span>
    <button class="btn btn-primary" onclick="window.print()">Печать</button>
</div>
<div class="sheet">
    {% for object in objects %}
        {% include "inventory/includes/label_58x40.html" %}
    {% endfor %}
</div>
<script>
    window.addEventListener("load", function () {
        window.print();
    });
</script>
</body>
</html>
